[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinonyx", email = "150762403+Vinonyx@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.1.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
